[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molsim-agent"
version = "0.1.0"
description = "A transparent LLM agent for molecular-simulation file conversion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "molsim-agent contributors" }]
dependencies = [
  "ase>=3.23",
]

[project.urls]
Repository = "https://github.com/SamDFr/molconvert"
Issues = "https://github.com/SamDFr/molconvert/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["MDAnalysis>=2.7", "scipy>=1.11", "pandas>=2"]
mace = ["mace-torch>=0.3"]
uma = ["fairchem-core>=1"]
all = ["pytest>=8", "MDAnalysis>=2.7", "scipy>=1.11", "pandas>=2", "mace-torch>=0.3", "fairchem-core>=1"]

[project.scripts]
molsim-agent = "molsim_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/molsim_agent"]

[tool.hatch.build.targets.wheel.force-include]
"skills/molecular-conversion/SKILL.md" = "molsim_agent/skills/molecular-conversion/SKILL.md"
"skills/molecular-conversion-compact/SKILL.md" = "molsim_agent/skills/molecular-conversion-compact/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
